name: Security release gate

on:
  workflow_dispatch:
  push:
    branches:
      - 'verification/container-cron-*'

permissions:
  contents: read

concurrency:
  group: container-cron-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      DAPPER_IMAGE: pasturestack/container-cron-dapper:${{ github.sha }}
      RUNTIME_IMAGE: pasturestack/container-cron:v0.6.2
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
      VERSION_OVERRIDE: v0.6.2

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-revision.txt
          sha256sum \
            Dockerfile.dapper \
            package/Dockerfile \
            scripts/package \
            security/dapper.openvex.json \
            ubuntu-apt.lock \
            go.mod \
            go.sum \
            > evidence/source-locks.sha256

      - name: Build, test, validate, and package
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg DAPPER_HOST_ARCH=amd64 \
            --tag "$DAPPER_IMAGE" \
            --file Dockerfile.dapper \
            .
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/go/src/github.com/PastureStack/container-cron" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --env "DAPPER_UID=$(id -u)" \
            --env "DAPPER_GID=$(id -g)" \
            --env ARCH=amd64 \
            --env "VERSION_OVERRIDE=$VERSION_OVERRIDE" \
            --env "IMAGE_NAME=pasturestack/container-cron" \
            --env TAG=v0.6.2 \
            "$DAPPER_IMAGE" ci
          test -x bin/container-cron
          test -L bin/container-crontab
          bin/container-cron --version | grep -F 'v0.6.2' >/dev/null
          test "$(cat dist/images)" = "$RUNTIME_IMAGE"
          docker image inspect "$RUNTIME_IMAGE" >/dev/null

      - name: Run Docker lifecycle smoke test
        shell: bash
        run: |
          set -euo pipefail
          VERSION_OVERRIDE=v0.6.2 \
            TAG=v0.6.2 \
            IMAGE_NAME=pasturestack/container-cron \
            ./scripts/smoke

      - name: Record resolved build inputs
        shell: bash
        run: |
          set -euo pipefail
          docker inspect "$DAPPER_IMAGE" > evidence/dapper-image-inspect.json
          docker inspect "$RUNTIME_IMAGE" > evidence/runtime-image-inspect.json
          docker run --rm --entrypoint sh "$DAPPER_IMAGE" -lc \
            "printf 'package\\tversion\\n'; dpkg-query -W -f='\${binary:Package}\\t\${Version}\\n' | LC_ALL=C sort" \
            > evidence/dapper-dpkg.tsv
          docker run --rm --entrypoint sh "$RUNTIME_IMAGE" -lc \
            "printf 'package\\tversion\\n'; dpkg-query -W -f='\${binary:Package}\\t\${Version}\\n' | LC_ALL=C sort" \
            > evidence/runtime-dpkg.tsv
          docker run --rm --entrypoint go \
            --volume "$PWD:/work:ro" "$DAPPER_IMAGE" \
            version -m /work/bin/container-cron \
            > evidence/product-go-version.txt
          docker run --rm --entrypoint sh "$DAPPER_IMAGE" -lc \
            'docker --version; go version -m /usr/bin/docker' \
            > evidence/docker-cli-version.txt
          grep -F $'build\tCGO_ENABLED=0' evidence/product-go-version.txt >/dev/null
          grep -F 'Docker version 29.9.2' evidence/docker-cli-version.txt >/dev/null
          docker run --rm --entrypoint sh "$DAPPER_IMAGE" -lc \
            'test ! -e /usr/libexec/docker/cli-plugins/docker-buildx'
          sha256sum bin/container-cron > evidence/container-cron.sha256

      - name: Scan source, product, and images
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$TRIVY_IMAGE"
          trivy_cache="$RUNNER_TEMP/trivy-cache"
          source_tree="$(mktemp -d)"
          product_tree="$(mktemp -d)"
          dapper_rootfs="$(mktemp -d)"
          dapper_container=""
          cleanup_scan() {
            if [ -n "$dapper_container" ]; then
              docker rm -f "$dapper_container" >/dev/null 2>&1 || true
            fi
            rm -rf "$source_tree" "$product_tree" "$dapper_rootfs" \
              "$RUNNER_TEMP/dapper-rootfs.tar"
          }
          trap cleanup_scan EXIT
          mkdir -p "$trivy_cache"
          git archive --format=tar HEAD | tar -xf - -C "$source_tree"
          cp bin/container-cron "$product_tree/container-cron"

          # Warm the pinned scanner database once, then run every gate against
          # that exact local snapshot so all scopes are directly comparable.
          docker run --rm \
            -v "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --download-db-only

          docker run --rm \
            -v "$source_tree:/scan:ro" \
            -v "$PWD/evidence:/evidence" \
            -v "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" fs \
            --skip-db-update --offline-scan --scanners vuln,secret --format json \
            --output /evidence/source-security.json /scan
          docker run --rm \
            -v "$product_tree:/scan:ro" \
            -v "$PWD/evidence:/evidence" \
            -v "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" rootfs \
            --skip-db-update --offline-scan --scanners vuln,secret --format json \
            --output /evidence/product-security.json /scan
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            -v "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --skip-db-update --offline-scan --scanners vuln,secret --format json \
            --output /work/evidence/runtime-security-raw.json "$RUNTIME_IMAGE"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            -v "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --skip-db-update --offline-scan --format cyclonedx \
            --output /work/evidence/runtime.cdx.json "$RUNTIME_IMAGE"
          backports="$RUNNER_TEMP/container-cron-ubuntu-backports"
          bash .github/scripts/collect-ubuntu-backport-evidence.sh \
            "$RUNTIME_IMAGE" "evidence/runtime.cdx.json" "$backports" \
            > "evidence/ubuntu-backports-verification.json"
          tar -C "$backports" -czf "evidence/ubuntu-backports.tar.gz" .
          docker run --rm -v "$backports:/backports:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            -v "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --vex /backports/openvex.json \
            --skip-db-update --offline-scan --scanners vuln,secret --format json \
            --output /work/evidence/runtime-security.json "$RUNTIME_IMAGE"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            -v "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --skip-db-update --offline-scan --scanners vuln,secret --format json \
            --output /work/evidence/dapper-image-metadata-raw.json "$DAPPER_IMAGE"

          # Gate the actual exported filesystem. Image metadata can contain an
          # upstream SBOM for packages that are no longer present, so retain
          # that report as evidence but do not use it as the applicability
          # decision.
          dapper_container="$(docker create "$DAPPER_IMAGE")"
          docker export --output "$RUNNER_TEMP/dapper-rootfs.tar" "$dapper_container"
          docker rm "$dapper_container"
          dapper_container=""
          tar --no-same-owner --no-same-permissions \
            -xf "$RUNNER_TEMP/dapper-rootfs.tar" -C "$dapper_rootfs"
          docker run --rm \
            -v "$dapper_rootfs:/scan:ro" \
            -v "$PWD/evidence:/evidence" \
            -v "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" rootfs \
            --skip-db-update --offline-scan --scanners vuln,secret --format json \
            --output /evidence/dapper-rootfs-raw.json /scan

          jq -r '
            .Results[]?.Vulnerabilities[]?
            | select(.Severity == "CRITICAL" or .Severity == "HIGH")
            | [.VulnerabilityID, .PkgIdentifier.PURL]
            | @tsv
          ' evidence/dapper-rootfs-raw.json | LC_ALL=C sort -u \
            > /tmp/dapper-critical-high.tsv
          jq -r '
            .statements[]?
            | select(
                .status == "not_affected"
                and .justification == "vulnerable_code_not_present"
              )
            | .vulnerability.name as $id
            | .products[]?
            | [$id, .["@id"]]
            | @tsv
          ' security/dapper.openvex.json | LC_ALL=C sort -u \
            > /tmp/dapper-vex.tsv
          test -s /tmp/dapper-critical-high.tsv
          diff -u /tmp/dapper-critical-high.tsv /tmp/dapper-vex.tsv
          test "$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' evidence/dapper-rootfs-raw.json)" \
            -eq "$(wc -l < /tmp/dapper-critical-high.tsv)"
          test "$(jq '.statements | length' security/dapper.openvex.json)" \
            -eq "$(wc -l < /tmp/dapper-vex.tsv)"
          jq -e '
            all(
              .statements[];
              .status == "not_affected"
              and .justification == "vulnerable_code_not_present"
              and ((.impact_statement | type) == "string")
              and ((.impact_statement | length) > 0)
            )
          ' security/dapper.openvex.json >/dev/null
          grep -F $'linux-libc-dev:amd64\t7.0.0-38.38' evidence/dapper-dpkg.tsv >/dev/null
          if grep -Eq '^linux-(image|modules)([-:]|[[:space:]])' evidence/dapper-dpkg.tsv; then
            printf 'Unexpected Linux kernel runtime package in Dapper image\n' >&2
            exit 1
          fi
          test -z "$(find "$dapper_rootfs" -type f \
            \( -path '*/boot/vmlinuz*' -o -path '*/lib/modules/*' -o -path '*/usr/lib/modules/*' \) \
            -print -quit)"
          cp /tmp/dapper-critical-high.tsv evidence/dapper-critical-high.tsv
          cp /tmp/dapper-vex.tsv evidence/dapper-openvex.tsv

          docker run --rm \
            -v "$source_tree:/scan:ro" \
            -v "$PWD/evidence:/evidence" \
            -v "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" fs --skip-db-update --offline-scan --format cyclonedx \
            --output /evidence/source.cdx.json /scan
          docker run --rm \
            -v "$product_tree:/scan:ro" \
            -v "$PWD/evidence:/evidence" \
            -v "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" rootfs --skip-db-update --offline-scan --format cyclonedx \
            --output /evidence/product.cdx.json /scan
          docker run --rm \
            -v "$dapper_rootfs:/scan:ro" \
            -v "$PWD/evidence:/evidence" \
            -v "$trivy_cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" rootfs --skip-db-update --offline-scan --format cyclonedx \
            --output /evidence/dapper-rootfs.cdx.json /scan

      - name: Enforce zero Critical, High, or secrets
        shell: bash
        run: |
          set -euo pipefail
          : > evidence/security-summary.txt
          for scope in source product runtime; do
            report="evidence/${scope}-security.json"
            secrets=$(jq '[.Results[]?.Secrets[]?] | length' "$report")
            critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$report")
            high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "$report")
            printf '%s_secrets=%s\n%s_critical=%s\n%s_high=%s\n' \
              "$scope" "$secrets" "$scope" "$critical" "$scope" "$high" \
              | tee -a evidence/security-summary.txt
            test "$secrets" -eq 0
            test "$critical" -eq 0
            test "$high" -eq 0
          done
          dapper_secrets=$(jq '[.Results[]?.Secrets[]?] | length' evidence/dapper-rootfs-raw.json)
          dapper_raw_critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' evidence/dapper-rootfs-raw.json)
          dapper_raw_high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' evidence/dapper-rootfs-raw.json)
          dapper_reviewed_critical=$(jq -n \
            --rawfile pairs evidence/dapper-critical-high.tsv \
            --slurpfile report evidence/dapper-rootfs-raw.json \
            '[($pairs | split("\n")[] | select(length > 0) | split("\t")[0])] as $ids
            | [$report[0].Results[]?.Vulnerabilities[]?
               | select(.Severity == "CRITICAL" and (.VulnerabilityID as $id | $ids | index($id)))]
            | length')
          dapper_reviewed_high=$(jq -n \
            --rawfile pairs evidence/dapper-critical-high.tsv \
            --slurpfile report evidence/dapper-rootfs-raw.json \
            '[($pairs | split("\n")[] | select(length > 0) | split("\t")[0])] as $ids
            | [$report[0].Results[]?.Vulnerabilities[]?
               | select(.Severity == "HIGH" and (.VulnerabilityID as $id | $ids | index($id)))]
            | length')
          dapper_applicable_critical=$((dapper_raw_critical - dapper_reviewed_critical))
          dapper_applicable_high=$((dapper_raw_high - dapper_reviewed_high))
          jq -n \
            --arg method 'exact-id-purl-set-match' \
            --arg source 'evidence/dapper-rootfs-raw.json' \
            --arg vex 'security/dapper.openvex.json' \
            --argjson raw_critical "$dapper_raw_critical" \
            --argjson raw_high "$dapper_raw_high" \
            --argjson reviewed_critical "$dapper_reviewed_critical" \
            --argjson reviewed_high "$dapper_reviewed_high" \
            --argjson applicable_critical "$dapper_applicable_critical" \
            --argjson applicable_high "$dapper_applicable_high" \
            '{method:$method,source_report:$source,vex_document:$vex,raw:{critical:$raw_critical,high:$raw_high},reviewed_not_affected:{critical:$reviewed_critical,high:$reviewed_high},applicable:{critical:$applicable_critical,high:$applicable_high}}' \
            > evidence/dapper-openvex-review.json
          printf 'dapper_secrets=%s\ndapper_raw_critical=%s\ndapper_raw_high=%s\ndapper_applicable_critical=%s\ndapper_applicable_high=%s\n' \
            "$dapper_secrets" "$dapper_raw_critical" "$dapper_raw_high" \
            "$dapper_applicable_critical" "$dapper_applicable_high" \
            | tee -a evidence/security-summary.txt
          test "$dapper_secrets" -eq 0
          test "$dapper_applicable_critical" -eq 0
          test "$dapper_applicable_high" -eq 0

      - name: Enforce full runtime vulnerability policy
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_runtime_vulnerability_policy.py
          python3 .github/scripts/enforce-runtime-vulnerabilities.py --repository PastureStack/container-cron < evidence/runtime-security.json

      - name: Retain the exact verified runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/security-runtime
          docker image inspect "$RUNTIME_IMAGE" > dist/security-runtime/images.json
          docker save "$RUNTIME_IMAGE" | gzip -n > dist/security-runtime/images.tar.gz
          cp evidence/runtime-security-raw.json evidence/runtime-security.json evidence/runtime.cdx.json \
            evidence/ubuntu-backports-verification.json evidence/ubuntu-backports.tar.gz dist/security-runtime/
          printf '%s\n' "$GITHUB_SHA" > dist/security-runtime/source-revision.txt
          (cd dist/security-runtime && sha256sum -- *.json *.tar.gz source-revision.txt > SHA256SUMS)
      - name: Retain verified runtime for immutable publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-runtime-${{ github.sha }}
          path: dist/security-runtime/
          if-no-files-found: error
          retention-days: 14

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-cron-security-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Clean runner resources
        if: always()
        shell: bash
        run: |
          set +e
          docker rm -f $(docker ps -aq --filter ancestor="$DAPPER_IMAGE") 2>/dev/null
          docker image rm -f "$DAPPER_IMAGE" "$RUNTIME_IMAGE" "$TRIVY_IMAGE" 2>/dev/null
          docker builder prune --all --force >/dev/null 2>&1
          sudo rm -rf bin dist
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build-test-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.6.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish only this run's verified immutable runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$GITHUB_SHA"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "security-runtime-$GITHUB_SHA" --dir dist/security-runtime
          test "$(cat dist/security-runtime/source-revision.txt)" = "$GITHUB_SHA"
          (cd dist/security-runtime && sha256sum --check SHA256SUMS)
          gzip -dc dist/security-runtime/images.tar.gz | docker load
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          : > dist/security-runtime/registry-images.jsonl
          local_image='pasturestack/container-cron:v0.6.2'
          remote_image="ghcr.io/pasturestack/container-cron:$RELEASE_TAG"
          if docker manifest inspect "$remote_image" >/dev/null 2>"$RUNNER_TEMP/manifest-error"; then
            echo "Refusing to replace an existing immutable image tag: $remote_image" >&2; exit 1
          else
            grep -Eq 'manifest unknown|no such manifest' "$RUNNER_TEMP/manifest-error"
          fi
          docker tag "$local_image" "$remote_image"
          docker push "$remote_image" | tee "$RUNNER_TEMP/push-log"
          pushed=$(awk '/digest: sha256:/{for(i=1;i<=NF;i++) if($i=="digest:") print $(i+1)}' "$RUNNER_TEMP/push-log")
          readback=$(docker buildx imagetools inspect "$remote_image" | awk '$1=="Digest:"{print $2; exit}')
          test "$pushed" = "$readback"
          [[ "$readback" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n --arg image "$remote_image" --arg digest "$readback" --arg source "$GITHUB_SHA" '{image:$image,digest:$digest,source:$source}' >> dist/security-runtime/registry-images.jsonl
          sha256sum dist/security-runtime/registry-images.jsonl > dist/security-runtime/registry-images.sha256
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REPOSITORY $RELEASE_TAG" --notes "Official security rebuild from $GITHUB_SHA. The release contains the exact tested/scanned runtime archive, SBOMs, and registry digest readbacks. No deployment is included." dist/security-runtime/*
